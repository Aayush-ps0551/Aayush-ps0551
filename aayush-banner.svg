<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <!-- Aura glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .matrix-bg { fill: #0d1117; }
      .title { font-family: 'Courier New', monospace; font-weight: bold; font-size: 64px; fill: #f97316; filter: url(#glow); }
      .subtitle { font-family: 'Courier New', monospace; font-size: 20px; fill: #22c55e; }
      .code { font-family: 'Courier New', monospace; font-size: 14px; fill: #166534; }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .floating { animation: float 4s ease-in-out infinite; }
      @keyframes type {
        0% { width: 0; }
        100% { width: 100%; }
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="250" class="matrix-bg" rx="15" />
  
  <!-- Hacker Grid / Code in background -->
  <g class="code" opacity="0.5">
    <text x="20" y="30">0x01A4F: require(msg.sender == owner, "Not Authorized");</text>
    <text x="20" y="60">0x02B1C: delegatecall(gas(), _target, ...); // VULNERABLE</text>
    <text x="20" y="90">0x03C9D: function withdraw() public {</text>
    <text x="40" y="120">uint bal = balances[msg.sender];</text>
    <text x="40" y="150">require(bal > 0);</text>
    <text x="40" y="180">(bool sent, ) = msg.sender.call{value: bal}("");</text>
    <text x="40" y="210">balances[msg.sender] = 0; // REENTRANCY!</text>
  </g>

  <!-- Aura / Dragon Ball elements -->
  <circle cx="400" cy="125" r="180" fill="#f97316" opacity="0.1" filter="url(#glow)"/>
  <circle cx="400" cy="125" r="120" fill="#eab308" opacity="0.15" filter="url(#glow)"/>

  <!-- Main Text -->
  <g class="floating" transform="translate(0, 0)">
    <text x="400" y="115" text-anchor="middle" class="title">AAYUSH</text>
    <text x="400" y="155" text-anchor="middle" class="subtitle">&gt; init --super-saiyan --hacker</text>
  </g>
  
  <!-- Scanning text -->
  <g transform="translate(250, 215)">
    <rect x="0" y="-15" width="300" height="20" fill="#0d1117" />
    <text x="150" y="0" text-anchor="middle" class="subtitle" fill="#22c55e">
      Scanning for vulnerabilities...
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
